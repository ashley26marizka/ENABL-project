<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 820" font-family="Segoe UI, Arial, sans-serif">

  <!-- Background -->
  <rect width="900" height="820" fill="#f8f9fa" rx="12"/>

  <!-- TITLE -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a1a2e">Scenario Analytics Platform — Architecture</text>

  <!-- LEFT PANEL: Current Architecture -->
  <rect x="20" y="56" width="410" height="740" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="10"/>
  <rect x="20" y="56" width="410" height="36" fill="#2d6a4f" rx="10"/>
  <rect x="20" y="80" width="410" height="12" fill="#2d6a4f"/>
  <text x="225" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Current Architecture — 100 scenarios/day</text>

  <rect x="155" y="112" width="140" height="44" fill="#e9f5db" stroke="#2d6a4f" stroke-width="1.5" rx="8"/>
  <text x="225" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2d6a4f">Client</text>
  <text x="225" y="148" text-anchor="middle" font-size="10" fill="#4a4a4a">Browser / curl / API</text>

  <line x1="225" y1="156" x2="225" y2="178" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="238" y="170" font-size="9" fill="#666">HTTP</text>

  <rect x="130" y="178" width="190" height="50" fill="#d8f3dc" stroke="#2d6a4f" stroke-width="2" rx="8"/>
  <text x="225" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#1b4332">FastAPI (single instance)</text>
  <text x="225" y="214" text-anchor="middle" font-size="10" fill="#4a4a4a">Uvicorn · Pydantic · SQLAlchemy</text>

  <line x1="180" y1="228" x2="130" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="270" y1="228" x2="320" y2="270" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="44" y="270" width="170" height="180" fill="#f0faf4" stroke="#52b788" stroke-width="1.5" rx="8"/>
  <text x="129" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1b4332">Processing Engine</text>

  <rect x="60" y="298" width="138" height="24" fill="#b7e4c7" stroke="#52b788" stroke-width="1" rx="5"/>
  <text x="129" y="314" text-anchor="middle" font-size="10" fill="#1b4332">1. CSV Reader</text>
  <line x1="129" y1="322" x2="129" y2="332" stroke="#52b788" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <rect x="60" y="332" width="138" height="24" fill="#b7e4c7" stroke="#52b788" stroke-width="1" rx="5"/>
  <text x="129" y="348" text-anchor="middle" font-size="10" fill="#1b4332">2. Validator</text>
  <line x1="129" y1="356" x2="129" y2="366" stroke="#52b788" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <rect x="60" y="366" width="138" height="24" fill="#b7e4c7" stroke="#52b788" stroke-width="1" rx="5"/>
  <text x="129" y="382" text-anchor="middle" font-size="10" fill="#1b4332">3. Processor (durations)</text>
  <line x1="129" y1="390" x2="129" y2="400" stroke="#52b788" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <rect x="60" y="400" width="138" height="24" fill="#b7e4c7" stroke="#52b788" stroke-width="1" rx="5"/>
  <text x="129" y="416" text-anchor="middle" font-size="10" fill="#1b4332">4. KPI Calculator</text>
  <line x1="129" y1="424" x2="129" y2="434" stroke="#52b788" stroke-width="1.5" marker-end="url(#arrGreen)"/>

  <rect x="60" y="434" width="138" height="24" fill="#b7e4c7" stroke="#52b788" stroke-width="1" rx="5"/>
  <text x="129" y="450" text-anchor="middle" font-size="10" fill="#1b4332">5. DB Repository</text>

  <rect x="265" y="270" width="145" height="80" fill="#fff0f3" stroke="#e63946" stroke-width="1.5" rx="8"/>
  <text x="337" y="295" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d0208">PostgreSQL</text>
  <text x="337" y="311" text-anchor="middle" font-size="9" fill="#4a4a4a">scenarios</text>
  <text x="337" y="324" text-anchor="middle" font-size="9" fill="#4a4a4a">scenario_runs</text>
  <text x="337" y="337" text-anchor="middle" font-size="9" fill="#4a4a4a">scenario_summary</text>

  <line x1="198" y1="444" x2="265" y2="330" stroke="#555" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>

  <rect x="44" y="470" width="170" height="40" fill="#fff9db" stroke="#f9c74f" stroke-width="1.5" rx="8"/>
  <text x="129" y="487" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b5e00">data/scenarios.csv</text>
  <text x="129" y="502" text-anchor="middle" font-size="9" fill="#4a4a4a">65 rows · 8 scenarios</text>
  <line x1="129" y1="470" x2="129" y2="454" stroke="#f9c74f" stroke-width="1.5" marker-end="url(#arrYellow)"/>

  <rect x="44" y="530" width="366" height="50" fill="#e7f5ff" stroke="#4dabf7" stroke-width="1.5" rx="8"/>
  <text x="227" y="550" text-anchor="middle" font-size="11" font-weight="bold" fill="#1971c2">Deployed on Render</text>
  <text x="227" y="567" text-anchor="middle" font-size="9" fill="#4a4a4a">scenario-analytics-api-sgdw.onrender.com</text>

  <rect x="44" y="598" width="366" height="170" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1" rx="8"/>
  <text x="227" y="618" text-anchor="middle" font-size="11" font-weight="bold" fill="#333">REST Endpoints</text>
  <text x="60" y="638" font-size="10" fill="#2b8a3e">GET  /health</text>
  <text x="60" y="656" font-size="10" fill="#2b8a3e">GET  /api/v1/scenarios</text>
  <text x="60" y="674" font-size="10" fill="#2b8a3e">GET  /api/v1/scenarios/{id}</text>
  <text x="60" y="692" font-size="10" fill="#2b8a3e">GET  /api/v1/scenarios/{id}/summary</text>
  <text x="60" y="710" font-size="10" fill="#2b8a3e">GET  /api/v1/scenarios/{id}/runs</text>
  <text x="60" y="728" font-size="10" fill="#1971c2">GET  /docs  (Swagger UI)</text>
  <text x="60" y="746" font-size="10" fill="#666">JSON responses · 200/404/422 · Pydantic validation</text>

  <!-- RIGHT PANEL: Scaled Architecture -->
  <rect x="470" y="56" width="410" height="740" fill="#ffffff" stroke="#dee2e6" stroke-width="1.5" rx="10"/>
  <rect x="470" y="56" width="410" height="36" fill="#1d3557" rx="10"/>
  <rect x="470" y="80" width="410" height="12" fill="#1d3557"/>
  <text x="675" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Scaled Architecture — 10,000 scenarios/day</text>

  <rect x="605" y="112" width="140" height="40" fill="#d0ebff" stroke="#1971c2" stroke-width="1.5" rx="8"/>
  <text x="675" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1d3557">Clients</text>
  <text x="675" y="144" text-anchor="middle" font-size="10" fill="#4a4a4a">Multiple concurrent</text>
  <line x1="675" y1="152" x2="675" y2="172" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="575" y="172" width="200" height="38" fill="#a5d8ff" stroke="#1971c2" stroke-width="2" rx="8"/>
  <text x="675" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d3557">Load Balancer</text>
  <text x="675" y="202" text-anchor="middle" font-size="9" fill="#4a4a4a">Render / Railway auto-scaling</text>

  <line x1="635" y1="210" x2="570" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="715" y1="210" x2="780" y2="240" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="484" y="240" width="160" height="44" fill="#dbe4ff" stroke="#4263eb" stroke-width="1.5" rx="8"/>
  <text x="564" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d3557">FastAPI #1</text>
  <text x="564" y="274" text-anchor="middle" font-size="9" fill="#4a4a4a">async def endpoints</text>

  <rect x="706" y="240" width="160" height="44" fill="#dbe4ff" stroke="#4263eb" stroke-width="1.5" rx="8"/>
  <text x="786" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#1d3557">FastAPI #2</text>
  <text x="786" y="274" text-anchor="middle" font-size="9" fill="#4a4a4a">async def endpoints</text>

  <line x1="564" y1="284" x2="620" y2="316" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="786" y1="284" x2="730" y2="316" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="560" y="316" width="230" height="44" fill="#ffe8cc" stroke="#fd7e14" stroke-width="2" rx="8"/>
  <text x="675" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#7c2d12">Message Queue</text>
  <text x="675" y="350" text-anchor="middle" font-size="9" fill="#4a4a4a">Redis / RabbitMQ · absorbs bursts</text>

  <line x1="620" y1="360" x2="530" y2="394" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="675" y1="360" x2="675" y2="394" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="730" y1="360" x2="820" y2="394" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="484" y="394" width="88" height="44" fill="#fff0f6" stroke="#ae3ec9" stroke-width="1.5" rx="8"/>
  <text x="528" y="412" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a0572">Worker #1</text>
  <text x="528" y="428" text-anchor="middle" font-size="9" fill="#4a4a4a">Processing</text>

  <rect x="631" y="394" width="88" height="44" fill="#fff0f6" stroke="#ae3ec9" stroke-width="1.5" rx="8"/>
  <text x="675" y="412" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a0572">Worker #2</text>
  <text x="675" y="428" text-anchor="middle" font-size="9" fill="#4a4a4a">Processing</text>

  <rect x="778" y="394" width="88" height="44" fill="#fff0f6" stroke="#ae3ec9" stroke-width="1.5" rx="8"/>
  <text x="822" y="412" text-anchor="middle" font-size="10" font-weight="bold" fill="#6a0572">Worker #3</text>
  <text x="822" y="428" text-anchor="middle" font-size="9" fill="#4a4a4a">Processing</text>

  <line x1="528" y1="438" x2="620" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="675" y1="438" x2="675" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="822" y1="438" x2="730" y2="480" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="560" y="480" width="230" height="38" fill="#fff9db" stroke="#f59f00" stroke-width="1.5" rx="8"/>
  <text x="675" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#7b5e00">PgBouncer</text>
  <text x="675" y="510" text-anchor="middle" font-size="9" fill="#4a4a4a">Connection pool · prevents DB overload</text>
  <line x1="675" y1="518" x2="675" y2="540" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="530" y="540" width="290" height="76" fill="#fff0f3" stroke="#e63946" stroke-width="2" rx="8"/>
  <text x="675" y="560" text-anchor="middle" font-size="11" font-weight="bold" fill="#9d0208">PostgreSQL Cluster</text>
  <rect x="545" y="568" width="120" height="36" fill="#ffc9c9" stroke="#e63946" stroke-width="1" rx="5"/>
  <text x="605" y="582" text-anchor="middle" font-size="9" font-weight="bold" fill="#9d0208">Primary (writes)</text>
  <text x="605" y="596" text-anchor="middle" font-size="9" fill="#4a4a4a">Workers write here</text>
  <rect x="685" y="568" width="120" height="36" fill="#ffc9c9" stroke="#e63946" stroke-width="1" rx="5"/>
  <text x="745" y="582" text-anchor="middle" font-size="9" font-weight="bold" fill="#9d0208">Read Replica</text>
  <text x="745" y="596" text-anchor="middle" font-size="9" fill="#4a4a4a">GET queries</text>

  <rect x="484" y="638" width="382" height="60" fill="#f3f0ff" stroke="#7950f2" stroke-width="1.5" rx="8"/>
  <text x="675" y="656" text-anchor="middle" font-size="11" font-weight="bold" fill="#5f3dc4">Monitoring &amp; Observability</text>
  <text x="675" y="672" text-anchor="middle" font-size="9" fill="#4a4a4a">Structured JSON logs → Datadog / CloudWatch</text>
  <text x="675" y="686" text-anchor="middle" font-size="9" fill="#4a4a4a">Queue depth alerts · Slow-query log · Dead-letter queue</text>

  <rect x="484" y="714" width="382" height="54" fill="#ebfbee" stroke="#2f9e44" stroke-width="1" rx="8"/>
  <text x="675" y="731" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b4332">Failure Handling</text>
  <text x="675" y="747" text-anchor="middle" font-size="9" fill="#4a4a4a">Failed jobs retried 3x with exponential back-off</text>
  <text x="675" y="760" text-anchor="middle" font-size="9" fill="#4a4a4a">DB transactions roll back on partial failure</text>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#52b788"/>
    </marker>
    <marker id="arrYellow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#f9c74f"/>
    </marker>
  </defs>

</svg>
