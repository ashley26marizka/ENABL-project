services:
  - type: web
    name: scenario-analytics-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CSV_PATH
        value: ../data/scenarios.csv
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        sync: false
