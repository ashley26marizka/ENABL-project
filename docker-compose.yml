version: "3.9"

# Docker Compose is provided for local PostgreSQL development only.
# The API is NOT containerised — run it directly with uvicorn (see README).
# Deployment is handled by Render using render.yaml.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: scenario_analytics
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql

volumes:
  pgdata:
